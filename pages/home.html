<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>执信论坛 - 首页</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=20261005a">
  <link rel="stylesheet" href="../css/lottie-icon-styles.css?v=20261005a">
</head>
<body class="home-page">
  <header class="home-header">
    <div class="header-content">
      <div class="header-left">
        <button class="menu-button" id="menuButton" aria-label="打开菜单">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
          </svg>
        </button>
        <a href="home.html" class="logo-link">
          <img src="../logo/微信图片_20260829230932_80_21_transparent.png" alt="执信论坛" class="logo">
          <span class="site-title">执信论坛 <span class="version-badge">正式版 1.0</span></span>
        </a>
      </div>

      <div class="header-center">
        <div class="search-bar">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" class="search-input" id="searchInput" placeholder="搜索帖子、用户、标签..." />
          <button class="search-button" id="searchButton" aria-label="搜索">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="header-right">
        <button class="user-menu-button" id="userMenuButton" aria-label="用户菜单">
          <img id="userAvatar" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="用户头像" class="user-avatar" />
          <span class="user-nickname" id="userNickname"></span>
          <svg class="menu-arrow" viewBox="0 0 24 24" fill="currentColor">
            <path d="M7 10l5 5 5-5z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <div class="home-container">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-content">
        <div class="sidebar-header">
          <div class="sidebar-logo">
            <img src="../logo/微信图片_20260829230932_80_21_transparent.png" alt="执信论坛" class="logo">
          </div>
          <span class="sidebar-title">执信论坛</span>
          <button class="sidebar-close" id="sidebarClose" aria-label="关闭菜单">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
            </svg>
          </button>
        </div>

        <div class="sidebar-section">
          <h3 class="section-title">快速导航</h3>
          <ul class="nav-list">
            <li class="nav-item active">
              <a href="home.html">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>
                <span>全部校区</span>
              </a>
            </li>
            <li class="nav-item">
              <a href="profile.html">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
                <span>个人资料</span>
              </a>
            </li>
            <li class="nav-item">
              <a href="my-posts.html">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
                </svg>
                <span>我的帖子</span>
              </a>
            </li>
            <li class="nav-item">
              <a href="favorites.html">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
                <span>我的收藏</span>
              </a>
            </li>
            <li class="nav-item" id="navAdminEntry" style="display: none;">
              <a href="admin.html">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path d="M13 11H11v2h2v-2zm3.29-5.53l.58 1.58 1.66.19 1.29.99-.79 1.38.72 1.51-1.48.76.02 1.67-1.64.32-.42 1.62-1.65-.29-.97 1.37-1.55-1.12-.88 1.42-1.57-.77.2-1.66-1.34-1 .47-1.61 1.62-.33L10 7.85H8.4zM12.1 3C8.42 1.78 4.56 3.33 3.34 7.02L5.1 7.6c.91-2.32 3.15-3.85 5.6-3.6L12.1 3zM21 13.1c-1.22-3.68-5.08-5.23-8.85-4.02l.58 1.76c2.36-.91 4.94.27 5.85 2.63l1.42-1.27zM15 15h-6v4a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-4z"/>
                </svg>
                <span>管理后台</span>
              </a>
            </li>
          </ul>
        </div>

        <div class="sidebar-footer">
          <button class="logout-btn" id="sidebarLogoutBtn">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
            </svg>
            <span>退出登录</span>
          </button>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <nav class="category-nav" id="branchNav">
        <div class="category-scroll" id="branchScroll">
        </div>
      </nav>

      <div class="posts-container" id="postsContainer">
        <div class="create-post-card">
          <a href="post.html" class="create-post-button">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
            </svg>
            <span>发布帖子</span>
          </a>
        </div>
        <div class="posts-loading" id="postsLoading">
          <span class="material-symbols-outlined loading-spinner" aria-hidden="true">progress_activity</span>
          <span>加载中...</span>
        </div>
        <div class="hot-posts-section" id="hotPostsSection" style="display: none;">
          <h3 class="section-title">热门帖子</h3>
          <div class="posts-list" id="hotPostsList"></div>
        </div>
        <div class="posts-list" id="postsList"></div>
        <div class="loading-more" id="loadingMore" style="display: none;">
          <span class="material-symbols-outlined loading-spinner" aria-hidden="true">progress_activity</span>
          <span>加载更多...</span>
        </div>
        <div class="no-more-posts" id="noMorePosts" style="display: none;">
          <span>没有更多帖子了</span>
        </div>
        <div class="no-posts" id="noPosts" style="display: none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <p>暂无帖子，快来发表第一篇吧！</p>
          <a href="post.html" class="btn-primary">发帖</a>
        </div>
      </div>
    </main>

    <aside class="right-sidebar">
      <div class="sidebar-card">
        <h3 class="card-title">热门帖子</h3>
        <div class="hot-posts" id="hotPosts"></div>
      </div>

      <div class="sidebar-card">
        <h3 class="card-title">最新回复</h3>
        <div class="latest-comments" id="latestComments"></div>
      </div>

      <div class="sidebar-card">
        <h3 class="card-title">统计信息</h3>
        <div class="stats-grid">
          <div class="stat-item">
            <span class="stat-value" id="totalPosts">0</span>
            <span class="stat-label">总帖子</span>
          </div>
          <div class="stat-item">
            <span class="stat-value" id="totalComments">0</span>
            <span class="stat-label">总评论</span>
          </div>
          <div class="stat-item">
            <span class="stat-value" id="totalUsers">0</span>
            <span class="stat-label">总用户</span>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <div class="image-lightbox" id="imageLightbox">
    <div class="image-lightbox-content">
      <img src="" alt="图片预览" id="lightboxImage" />
    </div>
    <button class="image-lightbox-close" id="lightboxClose" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
      </svg>
    </button>
  </div>

  <div class="snackbar-container" id="snackbarContainer">
    <div class="md3-snackbar" id="snackbar">
      <div class="md3-snackbar-surface">
        <div class="md3-snackbar-row">
          <svg class="md3-snackbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span class="md3-snackbar-label" id="snackbarLabel"></span>
        </div>
        <button class="md3-snackbar-action" id="snackbarAction" type="button">
          <span class="md3-snackbar-action-label">关闭</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Lottie动画库 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <!-- Lottie图标工具库 -->
  <script src="../js/lottie-icon-utils.js?v=20260822b"></script>
  <script src="../assets/js/supabase.js"></script>
  <script type="module" src="../js/theme-init.js?v=20261005a"></script>
  <script type="module" src="../js/home.js?v=20260928o"></script>
<footer class="site-footer">© 2026 执信论坛 · +1科创工作室</footer>
</body>
</html>
