<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>执信论坛 - 登录</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=20260822a">
  <link rel="stylesheet" href="../css/lottie-icon-styles.css?v=20260822b">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo-wrapper">
          <img src="../logo/微信图片_20260829230932_80_21_transparent.png" alt="执信论坛" class="logo">
        </div>
        <h1 class="login-title">执信论坛</h1>
        <p class="login-subtitle">欢迎回来，请登录您的账号</p>
      </div>

      <form class="login-form" id="loginForm" novalidate>
        <div class="form-field">
          <label class="form-label">学生身份</label>
          <div class="radio-group" id="studentTypeGroup">
            <div class="radio-option">
              <input type="radio" id="studentTypeSchool" name="studentType" value="school" />
              <label for="studentTypeSchool" class="radio-label">本校学生</label>
            </div>
            <div class="radio-option">
              <input type="radio" id="studentTypeExternal" name="studentType" value="external" />
              <label for="studentTypeExternal" class="radio-label">外校学生</label>
            </div>
          </div>
          <span class="form-error" id="studentTypeError"></span>
        </div>

        <div class="form-field">
          <label class="form-label" for="branch">所属分校</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 010-5 2.5 2.5 0 010 5z"/>
            </svg>
            <select id="branch" class="form-input form-select" required>
              <option value="">请选择所属分校</option>
            </select>
          </div>
          <span class="form-error" id="branchError"></span>
        </div>

        <div class="form-field">
          <label class="form-label" for="grade">年级</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 3L1 9l11 6 9-4.91V17h2V9M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/>
            </svg>
            <select id="grade" class="form-input form-select" required>
              <option value="">请选择年级</option>
              <option value="初一">初一</option>
              <option value="初二">初二</option>
              <option value="初三">初三</option>
              <option value="高中及以上">高中及以上</option>
            </select>
          </div>
          <span class="form-error" id="gradeError"></span>
        </div>

        <div class="form-field" id="cohortField">
          <label class="form-label" for="cohort">届次</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11zm0-13H5V6h14v1z"/>
            </svg>
            <input type="text" id="cohort" class="form-input" placeholder="选择年级后自动计算" readonly disabled />
          </div>
          <span class="form-hint" id="cohortHint"></span>
        </div>

        <div class="form-field" id="classField" style="display: none;">
          <label class="form-label" for="classNumber">班级</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 7H5c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2h-7zm-5 9v-2h2v2H7zm4 0v-2h2v2h-2zm4 0v-2h2v2h-2z"/>
            </svg>
            <select id="classNumber" class="form-input form-select">
              <option value="">请选择班级</option>
            </select>
          </div>
          <span class="form-error" id="classNumberError"></span>
        </div>

        <div class="form-field" id="studentNumberField" style="display: none;">
          <label class="form-label" for="studentNumberInput">学号</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
            <select id="studentNumberInput" class="form-input form-select">
              <option value="">请选择学号</option>
            </select>
          </div>
          <span class="form-error" id="studentNumberError"></span>
        </div>

        <div class="form-field">
          <label class="form-label" for="password">密码</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
            </svg>
            <input type="password" id="password" class="form-input" placeholder="请输入密码" required autocomplete="current-password" />
            <button type="button" class="password-toggle" id="passwordToggle" aria-label="切换密码可见性">
              <svg class="toggle-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
              </svg>
            </button>
            <span class="input-validation-icon"></span>
          </div>
          <span class="form-error" id="passwordError"></span>
        </div>

        <div class="form-options">
          <a href="forgot-password.html" class="forgot-password">忘记密码？</a>
        </div>

        <button type="submit" class="login-button" id="loginButton">
          <span class="button-text">登录</span>
          <div class="button-loader" id="buttonLoader">
            <svg viewBox="25 25 50 50">
              <circle cx="50" cy="50" r="20" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-dasharray="100" class="loader-spinner"/>
            </svg>
          </div>
        </button>
      </form>

      <div class="login-footer">
        <p class="signup-link">
          还没有账号？
          <a href="register.html" class="link-primary">立即注册</a>
        </p>
      </div>

      <div class="snackbar-container" id="snackbarContainer">
        <div class="md3-snackbar" id="snackbar">
          <div class="md3-snackbar-surface">
            <div class="md3-snackbar-row">
              <svg class="md3-snackbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
              </svg>
              <span class="md3-snackbar-label" id="snackbarLabel"></span>
            </div>
            <button class="md3-snackbar-action" id="snackbarAction" type="button">
              <span class="md3-snackbar-action-label">关闭</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="account-selection-modal" id="accountSelectionModal" style="display: none;">
      <div class="account-selection-overlay"></div>
      <div class="account-selection-content">
        <div class="account-selection-header">
          <h3>请选择你的账号</h3>
          <p class="account-selection-desc">检测到多个符合身份的账号，请选择你自己的账号</p>
        </div>
        <div class="account-selection-body" id="accountSelectionList">
        </div>
        <div class="account-selection-footer">
          <button type="button" class="account-selection-cancel" id="accountSelectionCancel">取消</button>
        </div>
      </div>
    </div>

    <div class="login-decoration">
      <div class="decoration-circle circle-1"></div>
      <div class="decoration-circle circle-2"></div>
      <div class="decoration-circle circle-3"></div>
    </div>
  </div>

  <!-- Lottie动画库 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <!-- Lottie图标工具库 -->
  <script src="../js/lottie-icon-utils.js?v=20260822b"></script>
  <script src="../assets/js/supabase.js"></script>
  <script type="module" src="../js/login.js?v=20260821h"></script>
<footer class="site-footer">© 2026 执信论坛 · 星夜工作室</footer>
</body>
</html>
