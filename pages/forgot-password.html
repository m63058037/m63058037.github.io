<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>执信论坛 - 找回密码</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=20261005a">
</head>
<body class="forgot-password-page">
  <div class="forgot-password-container">
    <div class="forgot-password-card">
      <div class="forgot-password-header">
        <a href="login.html" class="back-link">
          <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
          </svg>
          返回登录
        </a>
        <h1 class="forgot-password-title">忘记密码？</h1>
        <p class="forgot-password-subtitle">通过管理员验证身份后重置密码</p>
      </div>

      <div class="forgot-password-step" id="stepInput">
        <div class="form-field">
          <label class="form-label" for="fpUid">用户UID</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
            </svg>
            <input type="text" id="fpUid" class="form-input" placeholder="请输入8位用户UID" maxlength="8" autocomplete="username" />
          </div>
          <span class="form-error" id="fpUidError"></span>
        </div>

        <button type="button" class="google-style-btn" id="requestResetBtn">
          <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
          <span class="button-text">向管理员验证身份</span>
        </button>
      </div>

      <div class="forgot-password-step" id="stepPending" style="display: none;">
        <div class="status-card status-pending">
          <svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          <h3>请求已提交</h3>
          <p>您的密码重置请求已提交，请等待管理员处理。</p>
          <p class="status-hint">处理完成后，请再次访问此页面查看结果。</p>
        </div>
        <button type="button" class="google-style-btn" id="checkStatusBtn">
          <span class="button-text">检查处理状态</span>
        </button>
      </div>

      <div class="forgot-password-step" id="stepApproved" style="display: none;">
        <div class="status-card status-approved">
          <svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <h3>管理员已同意</h3>
          <p>管理员已经同意了您重置密码的请求，请设置新密码。</p>
        </div>

        <div class="form-field">
          <label class="form-label" for="newPassword">新密码</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
            </svg>
            <input type="password" id="newPassword" class="form-input" placeholder="至少2个英文字母 + 至少6个数字" autocomplete="new-password" />
            <button type="button" class="password-toggle" id="newPasswordToggle" aria-label="切换密码可见性">
              <svg class="toggle-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
              </svg>
            </button>
          </div>
          <div class="password-strength" id="newPasswordStrength">
            <div class="strength-bar">
              <div class="strength-segment" id="newStrength1"></div>
              <div class="strength-segment" id="newStrength2"></div>
              <div class="strength-segment" id="newStrength3"></div>
              <div class="strength-segment" id="newStrength4"></div>
            </div>
            <span class="strength-text" id="newStrengthText"></span>
          </div>
          <span class="form-error" id="newPasswordError"></span>
        </div>

        <div class="form-field">
          <label class="form-label" for="confirmNewPassword">确认新密码</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
            </svg>
            <input type="password" id="confirmNewPassword" class="form-input" placeholder="请再次输入新密码" autocomplete="new-password" />
            <button type="button" class="password-toggle" id="confirmNewPasswordToggle" aria-label="切换密码可见性">
              <svg class="toggle-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
              </svg>
            </button>
          </div>
          <span class="form-error" id="confirmNewPasswordError"></span>
        </div>

        <button type="button" class="google-style-btn" id="resetPasswordBtn">
          <span class="button-text">重置密码</span>
        </button>
      </div>

      <div class="forgot-password-step" id="stepRejected" style="display: none;">
        <div class="status-card status-rejected">
          <svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="15" y1="9" x2="9" y2="15"/>
            <line x1="9" y1="9" x2="15" y2="15"/>
          </svg>
          <h3>请求被拒绝</h3>
          <p>管理员拒绝了您的密码重置请求。</p>
          <p class="status-hint" id="rejectReason"></p>
        </div>
        <button type="button" class="google-style-btn" id="retryRequestBtn">
          <span class="button-text">重新申请</span>
        </button>
      </div>

      <div class="forgot-password-step" id="stepSuccess" style="display: none;">
        <div class="status-card status-success">
          <svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 11-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
          </svg>
          <h3>密码重置成功</h3>
          <p>请使用新密码登录。</p>
        </div>
        <a href="login.html" class="google-style-btn">
          <span class="button-text">前往登录</span>
        </a>
      </div>

      <div class="snackbar-container" id="snackbarContainer">
        <div class="md3-snackbar" id="snackbar">
          <div class="md3-snackbar-surface">
            <div class="md3-snackbar-row">
              <span class="md3-snackbar-label" id="snackbarLabel"></span>
            </div>
            <button class="md3-snackbar-action" id="snackbarAction" type="button">
              <span class="md3-snackbar-action-label">关闭</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/js/supabase.js"></script>
  <script type="module" src="../js/theme-init.js?v=20261005a"></script>
  <script type="module" src="../js/forgot-password.js?v=20260821h"></script>
<footer class="site-footer">© 2026 执信论坛 · +1科创工作室</footer>
</body>
</html>
