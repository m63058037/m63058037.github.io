<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>执信论坛 - 发帖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=20260822a">
  <link rel="stylesheet" href="../css/lottie-icon-styles.css?v=20260822b">
</head>
<body class="post-page">
  <header class="simple-header">
    <button class="back-button" id="backButton">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
      </svg>
      <span>返回</span>
    </button>
    <h1 class="page-title">发帖</h1>
  </header>

  <main class="post-content">
    <form class="post-form" id="postForm" novalidate>
      <div class="form-section">
        <label class="form-label" for="title">标题</label>
        <input
          type="text"
          id="title"
          class="form-input post-title-input"
          placeholder="请输入帖子标题（2-200字）"
          maxlength="200"
          required
        />
        <span class="input-counter" id="titleCounter">0</span>
        <span class="form-error" id="titleError"></span>
      </div>

      <div class="form-section">
        <label class="form-label" for="content">内容</label>
        <textarea
          id="content"
          class="form-textarea post-content-textarea"
          placeholder="请输入帖子内容..."
          required
        ></textarea>
        <span class="input-counter" id="contentCounter">0</span>
        <span class="form-error" id="contentError"></span>
      </div>

      <div class="form-section">
        <label class="form-label">校区范围</label>
        <div class="branch-select-area" id="branchSelectArea">
          <p class="form-hint" id="branchHint">请选择发布范围</p>
        </div>
        <span class="form-error" id="branchError"></span>
      </div>

      <div class="form-section">
        <label class="form-label">图片上传</label>
        <div class="image-upload-area" id="imageUploadArea">
          <div class="upload-button" id="uploadButton">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
            </svg>
            <span>点击上传图片（最多9张）</span>
          </div>
          <input type="file" id="imageFileInput" class="image-file-input" accept="image/*" multiple />
        </div>
        <div class="image-preview-grid" id="imagePreviewGrid"></div>
        <span class="form-error" id="imageError"></span>
      </div>

      <div class="form-section">
        <label class="form-label">标签</label>
        <div class="tags-input-area" id="tagsInputArea">
          <div class="tags-list" id="tagsList"></div>
          <div class="tag-input-row">
            <input
              type="text"
              id="tagInput"
              class="form-input tag-input"
              placeholder="输入标签内容（中文或英文）"
              maxlength="20"
            />
            <button type="button" class="tag-add-btn" id="tagAddBtn">添加</button>
          </div>
        </div>
        <p class="form-hint">标签以 # 开头，只能包含中文和英文字母，最多5个</p>
        <span class="form-error" id="tagsError"></span>
      </div>

      <button type="button" class="submit-button-bottom" id="submitButton">发布</button>
    </form>
  </main>

  <div class="image-lightbox" id="imageLightbox">
    <div class="image-lightbox-content">
      <img src="" alt="图片预览" id="lightboxImage" />
    </div>
    <button class="image-lightbox-close" id="lightboxClose" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
      </svg>
    </button>
  </div>

  <div class="snackbar-container" id="snackbarContainer">
    <div class="md3-snackbar" id="snackbar">
      <div class="md3-snackbar-surface">
        <div class="md3-snackbar-row">
          <svg class="md3-snackbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span class="md3-snackbar-label" id="snackbarLabel"></span>
        </div>
        <button class="md3-snackbar-action" id="snackbarAction" type="button">
          <span class="md3-snackbar-action-label">关闭</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Lottie动画库 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <!-- Lottie图标工具库 -->
  <script src="../js/lottie-icon-utils.js?v=20260822b"></script>
  <script src="../assets/js/supabase.js"></script>
  <script type="module" src="../js/post.js?v=20260821h"></script>
<footer class="site-footer">© 2026 执信论坛 · 星夜工作室</footer>
</body>
</html>
